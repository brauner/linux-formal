\* trace validation of MntPut: every trace-dependent constant comes from the NDJSON configuration line
SPECIFICATION TraceSpec
CONSTANTS
  TaskList <- TraceTaskList
  Walkers <- TraceWalkers
  Holders <- TraceHolders
  TaskMount <- TraceTaskMount
  BatchOrder <- OrderAB
  NCPU = 2
  GetBudget <- TraceGetBudget
  MIGRATE = FALSE
  MigBudget = 1
  MODE <- TraceMode
  LAZY <- TraceLazy
  FIX_MB_LEGIT = TRUE
  FIX_MB_UMOUNT = TRUE
  FIX_MB_PUT = TRUE
  FIX_MB_PEEK = TRUE
  FIX_RCU_DELAY = TRUE
  FIX_PUT_RCU = TRUE
  FIX_SYNC_FLAG = TRUE
  FIX_DOOMED_FLAG = TRUE
  FIX_SPLIT_COUNT = TRUE
  SPLIT_GETS_FIRST = FALSE
  WEAK_STORES = FALSE
  FIX_PUT_WMB = TRUE
  PEEK_LOOSE = FALSE
  PREV_SHAPE = FALSE
  QUEUE_LATE = FALSE
  FIX_PUT_RECHECK = FALSE
INVARIANTS
  TypeOK
  Ledger
  NoUAF
  DoomedIsLast
  NoNegative
POSTCONDITION TraceAccepted
